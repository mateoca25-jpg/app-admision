<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Práctica examen de admisión</title>
  <link rel="stylesheet" href="css/estilos.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>
  <div id="app">
    <p class="cargando">Cargando banco de preguntas...</p>
  </div>
  <script src="js/logica.js" defer></script>
  <script src="js/almacenamiento.js" defer></script>
  <script src="js/app.js" defer></script>
  <script>
    // Registra el service worker (ver sw.js) para que la app funcione sin internet
    // después de la primera carga.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
